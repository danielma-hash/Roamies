# The in-app updater's second address: the newest published release's latest.json, on the `updates` branch and served
# by raw.githubusercontent.com. The updater tries it when GitHub's release links time out (they have, for hours, while
# raw files and the API kept working). Runs when a release is published, or by hand.
name: Update feed

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  feed:
    # Disabled until the fork has a reviewed signing identity, manifest and update policy.
    if: ${{ vars.ROAMIES_SIGNED_RELEASES == 'enabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Put the newest release's latest.json on the updates branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          mkdir feed && cd feed
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json
          # Only a feed the updater can read goes out.
          node -e 'const j = JSON.parse(require("fs").readFileSync("latest.json", "utf8")); if (!j.version || !Object.keys(j.platforms ?? {}).length) process.exit(1)'
          git init -q -b updates
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add latest.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Update feed: $TAG"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:updates
          echo "updates branch now serves $TAG"
